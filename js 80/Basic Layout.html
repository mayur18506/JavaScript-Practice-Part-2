<!DOCTYPE html>
<html>

<head>
  <title>Form Events</title>
  <link rel="stylesheet" href="mayur.css">
</head>

<body>

  <form action="">

    <label for="name">Name</label>
    <input type="text" id="fname" onfocus="focusfunction(this)" onblur="blurfunction(this)"
      oninput="inputfunction(this)">
    <br><br>

    <label for="class">Class</label>
    <input type="text" id="class" onfocus="focusfunction(this)" onblur="blurfunction(this)"
      oninput="inputfunction(this)">
    <br><br>

    <label for="country">Country</label>
    <select id="country" onfocus="focusfunction(this)" onblur="blurfunction(this)" oninput="inputfunction(this)">
      <option value="India">India</option>
      <option value="Pakistan">Pakistan</option>
      <option value="Bangladesh">Bangladesh</option>
      <option value="Sri Lanka">Sri Lanka</option>
      <option value="Nepal">Nepal</option>
    </select>

  </form>
  <br>

  <div id="test" style="border: 1px solid red;"></div>
  <script src="index.js"></script>
</body>

</html>
